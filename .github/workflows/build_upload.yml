name: Build & Upload to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Official GM Xcode version
        run: |
          echo "=== All Available Xcode Versions ==="
          ls -d /Applications/Xcode*.app
          
          SELECTED_XCODE=""
          # Check installed Xcode 16 versions in reverse order for an official GM release (build ending in a digit)
          for x in $(ls -d /Applications/Xcode_16*.app | sort -V -r); do
            BUILD=$("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | grep "Build version" | awk '{print $3}')
            echo "Inspecting $x -> Build: $BUILD"
            if [[ "$BUILD" =~ [0-9]$ ]]; then
              SELECTED_XCODE="$x"
              echo "Found GM Xcode release: $SELECTED_XCODE with build $BUILD"
              break
            fi
          done

          if [ -z "$SELECTED_XCODE" ]; then
            # Fallback to default or 16.0
            SELECTED_XCODE="/Applications/Xcode_16.0.app"
          fi

          echo "Activating: $SELECTED_XCODE"
          sudo xcode-select -s "$SELECTED_XCODE"
          xcodebuild -version

      - name: Prepare Keychain & Apple WWDR Certificates
        run: |
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          KEYCHAIN_PWD="build_pwd"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          curl -sS -o AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true
          curl -sS -o AppleWWDRCAG6.cer https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer
          security import AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true

      - name: Install CocoaPods dependencies
        run: |
          pod install

      - name: Build and Upload via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
        run: |
          fastlane release
